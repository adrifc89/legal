<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textos legales</title>
<style>
  :root { --bg: #F5F0E6; --surface: #FFFDF8; --text: #2E3A32; --muted: #6F786F; --primary: #476A58; --line: #DED6C9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  .eyebrow { color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: 1.6px; margin: 0; }
  h1 { font-size: 28px; margin: 6px 0 6px; }
  p.lede { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 12px; }
  a.card {
    display: block; padding: 18px 20px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  }
  a.card:hover { border-color: var(--primary); }
  .name { font-weight: 800; font-size: 17px; }
  .what { color: var(--muted); font-size: 14px; margin-top: 2px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">ADRIFC89</p>
  <h1>Textos legales</h1>
  <p class="lede">Políticas de privacidad de mis aplicaciones. <span lang="en">Privacy policies for my apps.</span></p>

  <ul>
    <li>
      <a class="card" href="murdoku/">
        <div class="name">Detective Murdoku</div>
        <div class="what">Política de privacidad · <span lang="en">Privacy policy</span></div>
      </a>
    </li>
  </ul>

  <footer>Una carpeta por aplicación. <span lang="en">One folder per app.</span></footer>
</main>
</body>
</html>
